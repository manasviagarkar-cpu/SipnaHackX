<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="MaaSaathi – Comprehensive Maternity, Newborn Care, Cycle & Medical Guidance Companion for Desktop & Mobile." />
  <title>MaaSaathi – Maternal & Newborn Care Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       1. THEME TOKENS: LUXURY PASTEL & MATERNAL WELLNESS
       ========================================================================= */
    :root {
      --rose-50: #fff0f5;
      --rose-100: #ffe2eb;
      --rose-200: #fecddc;
      --rose-300: #fda4be;
      --rose-400: #fb719b;
      --rose-500: #f43f75;
      --rose-600: #e11d5a;
      --rose-700: #be1248;
      
      --purple-50: #f8f6ff;
      --purple-100: #eee7fe;
      --purple-200: #ded0fd;
      --purple-300: #c4b0fa;
      --purple-400: #a78bfa;
      --purple-500: #9333ea;
      --purple-600: #7e22ce;
      --purple-700: #6b21a8;

      --teal-50: #f0fdfa;
      --teal-100: #ccfbf1;
      --teal-500: #14b8a6;
      --teal-700: #0f766e;

      --amber-50: #fffbeb;
      --amber-100: #fef3c7;
      --amber-500: #f59e0b;
      --amber-700: #b45309;

      --blue-50: #f0f9ff;
      --blue-100: #e0f2fe;
      --blue-500: #0284c7;
      --blue-700: #0369a1;

      --dark-navy: #151329;
      --navy-800: #262343;
      --navy-700: #3b3761;
      --gray-500: #686580;
      --gray-400: #9a97b2;
      --gray-200: #e8e6f2;
      --gray-100: #f4f3fa;
      --bg-cream: #faf7f9;

      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;

      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-xl: 34px;
      --radius-full: 9999px;

      --shadow-sm: 0 4px 14px rgba(139, 92, 246, 0.06);
      --shadow-md: 0 8px 28px rgba(139, 92, 246, 0.09);
      --shadow-lg: 0 16px 42px rgba(139, 92, 246, 0.13);
      --shadow-purple: 0 10px 28px rgba(147, 51, 234, 0.26);
      --shadow-pink: 0 10px 28px rgba(244, 63, 117, 0.24);

      --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-main);
      background: var(--bg-cream);
      color: var(--dark-navy);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 8% 8%, rgba(254, 205, 220, 0.32) 0%, transparent 40%),
        radial-gradient(circle at 92% 16%, rgba(222, 208, 253, 0.38) 0%, transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(254, 243, 199, 0.24) 0%, transparent 40%);
      background-attachment: fixed;
    }

    button { font-family: var(--font-main); cursor: pointer; border: none; outline: none; }
    input, select, textarea { font-family: var(--font-main); }
    a { text-decoration: none; color: inherit; }

    /* =========================================================================
       2. RESPONSIVE TOP BAR & DESKTOP NAVBAR
       ========================================================================= */
    .top-bar {
      position: sticky; top: 0; z-index: 120;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(232, 230, 242, 0.85);
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .top-bar-inner {
      max-width: 1200px; margin: 0 auto; width: 100%;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar-wrapper {
      position: relative; width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #fbcfe8, #d8b4fe);
      padding: 2px; flex-shrink: 0; box-shadow: var(--shadow-sm);
    }
    .avatar-img {
      width: 100%; height: 100%; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: white; font-size: 1.4rem;
    }
    .greeting-sub { font-size: 0.72rem; color: var(--gray-500); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .greeting-title { font-size: 1.15rem; font-weight: 800; color: var(--dark-navy); line-height: 1.15; }

    /* Desktop Nav Links (Hidden on mobile, visible on desktop) */
    .desktop-nav-menu { display: none; align-items: center; gap: 6px; }
    .desktop-nav-link {
      padding: 8px 14px; border-radius: var(--radius-full);
      font-size: 0.84rem; font-weight: 700; color: var(--gray-500);
      background: transparent; transition: var(--transition); cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .desktop-nav-link:hover { color: var(--purple-700); background: var(--purple-50); }
    .desktop-nav-link.active {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      color: white; box-shadow: var(--shadow-purple);
    }

    .top-bar-right { display: flex; align-items: center; gap: 8px; }
    .mode-pill {
      background: var(--purple-50); border: 1.5px solid var(--purple-200);
      color: var(--purple-700); padding: 6px 14px; border-radius: var(--radius-full);
      font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 6px;
      transition: var(--transition);
    }
    .mode-pill:hover { background: var(--purple-100); transform: translateY(-1px); }
    .icon-btn-round {
      width: 38px; height: 38px; border-radius: 50%; background: white;
      border: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--navy-800); box-shadow: var(--shadow-sm); transition: var(--transition);
    }
    .icon-btn-round:hover { transform: scale(1.05); border-color: var(--purple-300); }

    /* =========================================================================
       3. RESPONSIVE LAYOUT CONTAINER
       ========================================================================= */
    .main-content {
      flex: 1; padding: 18px 16px 120px;
      margin: 0 auto; width: 100%; max-width: 540px;
      transition: max-width 0.3s ease;
    }

    /* Desktop Wide Screen Adaptation (>= 900px) */
    @media (min-width: 900px) {
      .main-content { max-width: 1160px; padding: 26px 24px 80px; }
      .desktop-nav-menu { display: flex; }
      .bottom-nav { display: none !important; }
      .desktop-grid-2col {
        display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; align-items: start;
      }
      .desktop-grid-3col {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
      }
    }

    /* Floating Bottom Dock (Mobile Only) */
    .bottom-nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 100; width: calc(100% - 24px); max-width: 500px;
      background: rgba(21, 19, 41, 0.94); backdrop-filter: blur(24px);
      border-radius: 30px; padding: 8px 10px;
      display: flex; justify-content: space-around; align-items: center;
      box-shadow: 0 14px 38px rgba(21, 19, 41, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 6px; border-radius: 20px; cursor: pointer;
      transition: var(--transition); background: none; border: none;
      color: #9a97b2; min-width: 44px;
    }
    .nav-item.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
    }
    .nav-item .nav-icon { font-size: 1.2rem; transition: var(--transition); line-height: 1; }
    .nav-item .nav-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.02em; }
    .nav-item.active .nav-icon { transform: scale(1.15); }
    .nav-item:hover { color: #fecddc; }

    /* Emergency Floating Action Button */
    .emergency-fab {
      position: fixed; bottom: 84px; right: 18px; z-index: 110;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white; border: none; border-radius: var(--radius-full);
      padding: 10px 18px; font-size: 0.78rem; font-weight: 800;
      box-shadow: 0 6px 22px rgba(239, 68, 68, 0.45);
      display: flex; align-items: center; gap: 6px;
      transition: var(--transition); cursor: pointer;
      animation: gentle-pulse 2.8s infinite;
    }
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 6px 22px rgba(239, 68, 68, 0.45); }
      50% { transform: scale(1.04); box-shadow: 0 8px 30px rgba(239, 68, 68, 0.65), 0 0 0 6px rgba(239,68,68,0.12); }
    }
    @media (min-width: 900px) {
      .emergency-fab { bottom: 24px; right: 28px; }
    }

    /* =========================================================================
       4. CARDS & HERO SURFACES
       ========================================================================= */
    .card {
      background: #ffffff; border-radius: var(--radius-lg); padding: 22px;
      box-shadow: var(--shadow-sm); border: 1px solid rgba(232, 230, 242, 0.85);
      margin-bottom: 18px; transition: var(--transition);
      position: relative; overflow: hidden;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    /* Segmented Time Controls (Weeks / Months / Trimesters) */
    .segment-bar {
      display: flex; background: rgba(232, 230, 242, 0.6);
      padding: 4px; border-radius: var(--radius-full);
      margin: 10px 0 16px;
    }
    .segment-btn {
      flex: 1; padding: 8px 14px; border-radius: var(--radius-full);
      font-size: 0.82rem; font-weight: 700; color: var(--gray-500);
      background: transparent; transition: var(--transition); text-align: center;
    }
    .segment-btn.active {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      color: white; box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
    }

    /* 3D Baby Hero Milestone Card (Image 1 Style) */
    .baby-hero-card {
      background: linear-gradient(135deg, #ffffff 0%, #faf5ff 50%, #fff0f5 100%);
      border-radius: var(--radius-xl); padding: 24px;
      border: 1px solid rgba(222, 208, 253, 0.65);
      box-shadow: var(--shadow-md); margin-bottom: 18px;
    }
    .baby-hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .baby-hero-badge {
      background: rgba(147, 51, 234, 0.1); color: var(--purple-700);
      padding: 4px 14px; border-radius: var(--radius-full);
      font-size: 0.76rem; font-weight: 800; display: inline-flex; align-items: center; gap: 4px;
    }
    .baby-hero-center {
      display: flex; align-items: center; justify-content: center; gap: 20px;
      margin: 18px 0; text-align: center;
    }
    .baby-3d-visual {
      width: 118px; height: 118px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffd6e0, #fbcfe8 60%, #e9d5ff 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.8rem; box-shadow: 0 12px 30px rgba(244, 63, 117, 0.22);
      animation: float-baby 4s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes float-baby {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }
    .stat-pill-box {
      background: white; border-radius: var(--radius-md); padding: 14px 18px;
      border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);
      text-align: left; min-width: 125px;
    }
    .stat-pill-num { font-size: 1.8rem; font-weight: 900; color: var(--dark-navy); line-height: 1; }
    .stat-pill-label { font-size: 0.72rem; color: var(--gray-500); font-weight: 700; text-transform: uppercase; margin-top: 3px; }

    /* Timeline Slider Card */
    .timeline-slider-card {
      background: white; border-radius: var(--radius-lg); padding: 20px;
      border: 1px solid var(--gray-200); margin-bottom: 18px; box-shadow: var(--shadow-sm);
    }
    .slider-track-container { position: relative; margin: 18px 0 10px; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; color: var(--gray-500); margin-bottom: 6px; }
    .slider-bar {
      width: 100%; height: 10px; border-radius: var(--radius-full);
      background: #eee7fe; position: relative; overflow: hidden;
    }
    .slider-bar-fill {
      height: 100%; border-radius: var(--radius-full);
      background: linear-gradient(90deg, #c084fc, #9333ea, #f43f75);
      transition: width 0.4s ease;
    }
    .timeline-milestones { display: flex; justify-content: space-between; margin-top: 10px; }
    .milestone-dot {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.7rem; font-weight: 700; color: var(--gray-400); cursor: pointer;
    }
    .milestone-dot.active { color: var(--purple-700); }
    .milestone-dot.active .dot-circle { background: var(--purple-600); box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.2); }
    .dot-circle { width: 10px; height: 10px; border-radius: 50%; background: #ddd6fe; transition: var(--transition); }

    /* 2x2 Grid of Floating Health Metrics (Image 1 Style) */
    .health-metric-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px;
    }
    .metric-card {
      border-radius: var(--radius-md); padding: 16px;
      transition: var(--transition); border: 1px solid transparent;
      display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
    }
    .metric-card-purple {
      background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
      color: white; box-shadow: var(--shadow-purple);
    }
    .metric-card-white {
      background: white; color: var(--dark-navy);
      border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);
    }
    .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .metric-icon-badge {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.22);
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
    }
    .metric-card-white .metric-icon-badge {
      background: var(--purple-50); color: var(--purple-700);
    }
    .metric-status { font-size: 0.72rem; font-weight: 700; opacity: 0.9; display: flex; align-items: center; gap: 4px; }
    .metric-value { font-size: 1.45rem; font-weight: 900; line-height: 1.1; margin-bottom: 2px; }
    .metric-title { font-size: 0.88rem; font-weight: 800; }
    .metric-unit { font-size: 0.72rem; font-weight: 600; opacity: 0.85; }

    /* =========================================================================
       5. FLO STYLE CYCLE WHEEL & CHIP SELECTORS (Image 2 & 3 Style)
       ========================================================================= */
    .cycle-wheel-container {
      position: relative; width: 230px; height: 230px; margin: 20px auto 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .cycle-circle-outer {
      width: 100%; height: 100%; border-radius: 50%;
      border: 13px solid #fce7f3;
      border-top-color: #f43f75; border-right-color: #a855f7; border-bottom-color: #38bdf8;
      position: absolute; top: 0; left: 0;
      animation: rotate-wheel 20s linear infinite;
    }
    @keyframes rotate-wheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .cycle-circle-inner {
      width: 175px; height: 175px; border-radius: 50%;
      background: radial-gradient(circle, #ffffff 60%, #fff1f5 100%);
      box-shadow: 0 8px 26px rgba(244, 63, 117, 0.18);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; z-index: 2;
    }
    .cycle-day-label { font-size: 0.78rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; }
    .cycle-day-num { font-size: 2.3rem; font-weight: 900; color: var(--rose-600); line-height: 1; margin: 2px 0; }
    .cycle-badge {
      background: #fdf2f8; color: #db2777; border-radius: var(--radius-full);
      padding: 3px 12px; font-size: 0.72rem; font-weight: 800;
    }

    /* Horizontal Calendar Day Strip */
    .calendar-strip {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px;
      margin-bottom: 18px; scrollbar-width: none;
    }
    .calendar-strip::-webkit-scrollbar { display: none; }
    .cal-day-pill {
      flex: 0 0 56px; height: 74px; border-radius: 20px;
      background: white; border: 1.5px solid var(--gray-200);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; transition: var(--transition);
    }
    .cal-day-pill.active {
      background: linear-gradient(135deg, #262343, #151329);
      color: white; border-color: transparent;
      box-shadow: 0 8px 20px rgba(21, 19, 41, 0.25);
    }
    .cal-day-pill.period-day { border-color: #f43f75; background: #fff1f5; }
    .cal-day-pill.ovulation-day { border-color: #0ea5e9; background: #f0f9ff; }
    .cal-day-name { font-size: 0.68rem; font-weight: 700; color: inherit; opacity: 0.75; }
    .cal-day-num { font-size: 1.18rem; font-weight: 800; color: inherit; }
    .cal-dot-indicator { width: 5px; height: 5px; border-radius: 50%; background: #f43f75; margin-top: 2px; }

    /* Categorized Logging Grid (Image 3 Style) */
    .category-section-title {
      font-size: 0.95rem; font-weight: 800; color: var(--dark-navy);
      margin: 18px 0 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .chip-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px;
    }
    .chip-card {
      background: white; border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-md); padding: 12px 8px; text-align: center;
      cursor: pointer; transition: var(--transition);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .chip-card:hover { border-color: var(--purple-300); transform: translateY(-2px); }
    .chip-card.selected {
      background: #fbf8ff; border-color: var(--purple-500);
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.15);
    }
    .chip-icon {
      width: 36px; height: 36px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .chip-label { font-size: 0.72rem; font-weight: 700; color: var(--navy-800); line-height: 1.2; }

    /* =========================================================================
       6. BUTTONS, FORMS & BADGES
       ========================================================================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px; border-radius: var(--radius-full); font-size: 0.88rem;
      font-weight: 800; transition: var(--transition); cursor: pointer; border: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      color: white; box-shadow: var(--shadow-purple);
    }
    .btn-primary:hover { box-shadow: 0 12px 30px rgba(147, 51, 234, 0.38); transform: translateY(-1px); }
    .btn-pink {
      background: linear-gradient(135deg, #fb719b, #f43f75);
      color: white; box-shadow: var(--shadow-pink);
    }
    .btn-secondary {
      background: var(--purple-100); color: var(--purple-700);
      border: 1px solid var(--purple-200);
    }
    .btn-secondary:hover { background: var(--purple-200); }
    .btn-ghost {
      background: var(--gray-100); color: var(--navy-800);
      border: 1px solid var(--gray-200);
    }
    .btn-ghost:hover { background: var(--gray-200); }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
    }
    .btn-teal {
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      color: white; box-shadow: 0 6px 20px rgba(20, 184, 166, 0.25);
    }
    .btn-sm { padding: 7px 14px; font-size: 0.78rem; border-radius: var(--radius-full); }
    .btn-lg { padding: 14px 28px; font-size: 0.96rem; border-radius: var(--radius-lg); }
    .btn-full { width: 100%; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--navy-800); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 11px 16px; border-radius: var(--radius-md);
      border: 1.5px solid var(--gray-200); font-size: 0.9rem;
      background: white; color: var(--dark-navy); transition: var(--transition);
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--purple-400); outline: none; box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Tabs Bar */
    .tab-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 9px 18px; border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 700;
      white-space: nowrap; cursor: pointer; border: 1.5px solid var(--gray-200);
      background: white; color: var(--gray-500); transition: var(--transition);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
    }

    /* Modal Overlay & Sheet */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(21, 19, 41, 0.65); z-index: 300;
      display: flex; align-items: flex-end; justify-content: center; padding: 14px;
      backdrop-filter: blur(6px); animation: fadeIn 0.2s ease;
    }
    @media (min-width: 768px) {
      .modal-overlay { align-items: center; }

const STORAGE_KEY = 'maasaathi_flo_v4';

let DB_LAST_SYNC = null;
let syncDebounceTimer = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return getDefaultData();
}

function saveData(syncNow = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(APP));
  } catch(e) {}

  // Trigger debounced or immediate sync to persistent server database
  if (syncNow) {
    pushDataToDatabase();
  } else {
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(pushDataToDatabase, 1200);
  }
}

async function pushDataToDatabase() {
  try {
    const res = await fetch('/api/records/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: 'user_default', data: APP })
    });
    if (res.ok) {
      const result = await res.json();
      DB_CONNECTED = true;
      DB_LAST_SYNC = new Date();
      updateDbStatusDot(true);
    }
  } catch (err) {
    // Graceful offline fallback
    DB_CONNECTED = false;
    updateDbStatusDot(false);
  }
}

async function fetchDataFromDatabase(silent = false) {
  try {
    const res = await fetch('/api/records/all?userId=user_default');
    if (res.ok) {
      const json = await res.json();
      if (json && json.data) {
        // Deep merge or update state

        localStorage.setItem(STORAGE_KEY, JSON.stringify(APP));
        DB_CONNECTED = true;

function getBabySizeForWeek(week) {
  let closest = BABY_GROWTH_STAGES[0];
  for (let s of BABY_GROWTH_STAGES) {
    if (week >= s.week) closest = s;
  }
  return closest;
}

function calcPregnancyStats(edd) {
  if (!edd) return { week: 24, completedWeeks: 24, remainingWeeks: 16, pct: 60, daysRemaining: 112, trimester: 'Second Trimester' };
  const now = new Date();
  const due = new Date(edd);
  const diffDays = Math.round((due - now) / (1000 * 60 * 60 * 24));
  const totalDays = 280;
  const daysPregnant = Math.max(1, totalDays - diffDays);
  const week = Math.max(1, Math.min(42, Math.ceil(daysPregnant / 7)));
  const completedWeeks = Math.max(0, week - 1);
  const remainingWeeks = Math.max(0, 40 - completedWeeks);
  const pct = Math.max(1, Math.min(100, Math.round((daysPregnant / totalDays) * 100)));
  const trimester = week <= 13 ? '1st Trimester' : week <= 27 ? '2nd Trimester' : '3rd Trimester';
  return { week, completedWeeks, remainingWeeks, pct, daysRemaining: Math.max(0, diffDays), trimester };
}

function formatDate(dStr) {

function setTimelineView(mode) {
  APP.settings.timelineView = mode;
  saveData();
  renderCurrentPage();
}

function jumpToWeek(w) {
  showToast(`Viewing Week ${w} milestones! 🌸`, 'success');
}

function toggleWaterGlass(num) {
  APP.waterGlasses = APP.waterGlasses === num ? num - 1 : num;
  saveData();
  renderCurrentPage();
  if (APP.waterGlasses === 8) {
    showToast('🎉 Awesome! You reached your 8-glass hydration goal today!', 'success');

}

function markAppointmentDone(id) {
  const apt = (APP.appointments || []).find(a => a.id === id);
  if (apt) {
    apt.done = true;
    saveData();
    showToast('Visit marked as completed! 🌸', 'success');
    renderCurrentPage();
  }
}

function deleteAppointment(id) {
  APP.appointments = (APP.appointments || []).filter(a => a.id !== id);
  saveData();
  renderCurrentPage();
}

function addDoctorQuestion() {
  const inp = document.getElementById('new-dq-input');
  if (!inp || !inp.value.trim()) return;
  APP.doctorQuestions = APP.doctorQuestions || [];
  APP.doctorQuestions.push({ id: uid(), question: inp.value.trim(), asked: false });
  saveData();
  renderCurrentPage();
}

function toggleDoctorQuestion(id) {
  const q = (APP.doctorQuestions || []).find(item => item.id === id);
  if (q) q.asked = !q.asked;
  saveData();
  renderCurrentPage();
}

function deleteDoctorQuestion(id) {
  APP.doctorQuestions = (APP.doctorQuestions || []).filter(item => item.id !== id);
  saveData();
  renderCurrentPage();
}

function toggleBreathingGuide() {
  const circle = document.getElementById('breath-circle');

  if (isBreathingActive) {

    renderCurrentPage();
    return;
  }
  
  isBreathingActive = true;
  let phase = 0;
  function step() {
    if (!circle) return;
    if (phase === 0) {
      circle.classList.add('expand');
      txt.textContent = 'Inhale 🌸';
      sub.textContent = 'Through nose (4s)';

  }

}

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playAudioTone(type) {
  initAudio();
  if (activeSoundNode) {
    activeSoundNode.stop();
    activeSoundNode = null;
  }
  if (currentAudioSound === type) {
    currentAudioSound = null;
    renderCurrentPage();
    return;
  }
  currentAudioSound = type;
  
  if (type === 'heartbeat') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(55, audioCtx.currentTime);
    const lfo = audioCtx.createOscillator();
    lfo.frequency.setValueAtTime(1.2, audioCtx.currentTime);
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    lfo.start();
    activeSoundNode = { stop: () => { osc.stop(); lfo.stop(); } };
  } else if (type === 'rain') {
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = (Math.random() * 2 - 1) * 0.12;
    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(700, audioCtx.currentTime);
    whiteNoise.connect(filter);
    filter.connect(audioCtx.destination);
    whiteNoise.start();
    activeSoundNode = { stop: () => whiteNoise.stop() };
  }
  renderCurrentPage();
}

async function sendChatMessage() {
  const inp = document.getElementById('chat-input');
  if (!inp || !inp.value.trim() || chatLoading) return;
  const userText = inp.value.trim();
  inp.value = '';
  APP.chatMessages = APP.chatMessages || [];
  APP.chatMessages.push({ role: 'user', content: userText });
  chatLoading = true;
  saveData();
  renderCurrentPage();

  const scrollChat = () => {
    const el = document.getElementById('chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  };
  scrollChat();

  let reply = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userText,
        language: APP.settings?.language || 'en',
        userId: 'user_default',
        context: {
          name: APP.profile?.name,
          pregnancyStatus: APP.profile?.status,
          currentWeek: calcPregnancyStats(APP.profile?.edd)?.week,
          estimatedDueDate: APP.profile?.edd,
          upcomingAppointment: (APP.appointments || []).find(a => !a.done),
          recentSymptoms: (APP.symptomLogs || []).slice(0, 3).map(s => ({ description: `${s.tags?.join(', ')} (${s.notes || ''})` }))
        }
      })
    });

    if (res.ok) {
      const data = await res.json();
      reply = data.reply;
    }
  } catch (e) {
    console.warn('Backend chat API offline, using intelligent local engine:', e);
  }

  // Fallback response if API was unreachable or returned empty
  if (!reply) {
    reply = "Dear Maa, every pregnancy journey is unique! Keep yourself well-hydrated, take your prescribed prenatal vitamins, and consult your obstetrician for personalized clinical reviews. 🌸";
    if (userText.toLowerCase().includes('tdap') || userText.toLowerCase().includes('vaccine') || userText.toLowerCase().includes('टीका')) {
      reply = "The **Tdap vaccine** is recommended between **27 and 36 weeks** of each pregnancy. It safely transfers whooping cough antibodies to your newborn baby before their first pediatric vaccine! 💉";
    } else if (userText.toLowerCase().includes('glucose') || userText.toLowerCase().includes('sugar')) {
      reply = "A standard 2-hour Oral Glucose Tolerance Test (OGTT) typically targets a fasting level under 92 mg/dL and 2-hour level under 140 mg/dL. Always confirm specific diagnostic thresholds with your doctor's lab. 🩸";
    } else if (userText.toLowerCase().includes('back') || userText.toLowerCase().includes('pain')) {
      reply = "Lower back discomfort is common around Week 24 as your center of gravity shifts. Using a maternity pillow between your knees while sleeping on your left side and practicing cat-cow stretches provides wonderful relief! 🌸";
    } else if (userText.toLowerCase().includes('kick') || userText.toLowerCase().includes('movement')) {
      reply = "Around Week 24, babies develop active sleep-wake cycles. Count 10 distinct kicks or rolls within 2 hours while relaxing on your left side. 👣";
    }
  }

  APP.chatMessages.push({ role: 'assistant', content: reply });
  chatLoading = false;
  saveData();
  renderCurrentPage();
  scrollChat();
}

function saveNewLabRecord() {
  const type = document.getElementById('lab-type')?.value;
  const result = document.getElementById('lab-result')?.value.trim() || 'Normal range';
  APP.clinicalRecords = APP.clinicalRecords || [];
  APP.clinicalRecords.unshift({
    id: uid(),
    type: type,
    week: document.getElementById('lab-week')?.value,
    date: document.getElementById('lab-date')?.value,
    result: result,
    status: 'Normal'
  });

  closeModal();
  showToast('Clinical report saved to your Medical Vault! 🔬', 'success');

}

async function openDatabaseVaultModal() {
  const modal = document.getElementById('modal-container');
  if (!modal) return;

  let dbStats = {
    status: DB_CONNECTED ? 'connected' : 'local_storage',
    engine: 'MaaSaathi Embedded JSON/SQL Data Vault',
    storageFile: 'server/data/maasaathi_db.json',
    counts: {
      users: 1,
      appointments: APP.appointments?.length || 0,
      clinicalRecords: APP.clinicalRecords?.length || 0,
      symptomLogs: APP.symptomLogs?.length || 0,
      kickSessions: APP.kickSessions?.length || 0,
      doctorQuestions: APP.doctorQuestions?.length || 0,
      checklists: APP.checklists?.length || 0,
      chatMessages: APP.chatMessages?.length || 0
    }
  };

  try {
    const res = await fetch('/api/db/status');
    if (res.ok) {
      dbStats = await res.json();
      DB_CONNECTED = true;
      updateDbStatusDot(true);
    }
  } catch (e) {
    // Offline mode
  }

  const isLive = dbStats.status === 'connected';

  modal.innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" style="max-width:540px;" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center" style="margin-bottom:12px;">
          <div class="flex items-center gap-10">
            <div style="width:40px; height:40px; border-radius:12px; background:var(--purple-100); display:flex; align-items:center; justify-content:center; font-size:1.4rem;">🗄️</div>
            <div>
              <h2 style="font-size:1.25rem; font-weight:900; color:var(--dark-navy);">Patient Database Vault</h2>
              <div class="text-xs text-muted">Persistent health records storage & synchronization</div>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>

        <!-- Connection Status Card -->
        <div class="card" style="background:${isLive ? '#f0fdf4' : '#fffbeb'}; border:1px solid ${isLive ? '#bbf7d0' : '#fde68a'}; margin-bottom:14px; padding:14px;">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-10">
              <span style="font-size:1.2rem;">${isLive ? '🟢' : '🟡'}</span>
              <div>
                <div class="font-bold text-sm" style="color:${isLive ? '#15803d' : '#b45309'};">
                  ${isLive ? 'Live Database Connected' : 'Offline Local Storage Mode'}
                </div>
                <div class="text-xs text-muted">
                  ${isLive ? 'Engine: ' + (dbStats.engine || 'MaaSaathi DB') : 'Syncs automatically when server is online'}
                </div>
              </div>
            </div>
            <button class="btn btn-sm ${isLive ? 'btn-primary' : 'btn-outline'}" onclick="manualSyncDatabase()">
              🔄 Sync Now
            </button>
          </div>
        </div>

        <!-- Live Database Records Metrics Grid -->
        <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:16px;">
          <div class="card" style="padding:12px; text-align:center; background:#faf5ff;">
            <div class="text-xs text-muted">📅 Appointments</div>
            <div style="font-size:1.35rem; font-weight:900; color:var(--purple-700);">${dbStats.counts?.appointments || 0}</div>
          </div>
          <div class="card" style="padding:12px; text-align:center; background:#f0fdfa;">
            <div class="text-xs text-muted">🔬 Clinical Lab Reports</div>
            <div style="font-size:1.35rem; font-weight:900; color:var(--teal-700);">${dbStats.counts?.clinicalRecords || 0}</div>
          </div>
          <div class="card" style="padding:12px; text-align:center; background:#fff0f5;">
            <div class="text-xs text-muted">📝 Symptoms Logged</div>
            <div style="font-size:1.35rem; font-weight:900; color:var(--rose-600);">${dbStats.counts?.symptomLogs || 0}</div>
          </div>
          <div class="card" style="padding:12px; text-align:center; background:#f0f9ff;">
            <div class="text-xs text-muted">👣 Kick Sessions</div>
            <div style="font-size:1.35rem; font-weight:900; color:var(--blue-700);">${dbStats.counts?.kickSessions || 0}</div>
          </div>
        </div>

        <!-- Patient Vault Actions -->
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn btn-primary btn-full" onclick="downloadDatabaseBackup()">
            💾 Download Full JSON Database Backup
          </button>
          <div class="flex gap-10">
            <button class="btn btn-secondary" style="flex:1;" onclick="exportMedicalReportPDF()">
              📋 Export Doctor Summary Slip (.txt)
            </button>
            <label class="btn btn-outline" style="flex:1; cursor:pointer; text-align:center; display:flex; align-items:center; justify-content:center;">
              📥 Restore Backup
              <input type="file" accept=".json" style="display:none;" onchange="restoreDatabaseFromFile(event)" />
            </label>
          </div>
        </div>

        <div style="margin-top:14px; text-align:center; font-size:0.75rem; color:var(--gray-500);">
          🔒 Patient privacy preserved. Health records stored locally & encrypted on your device.
        </div>
      </div>
    </div>
  `;
}

async function manualSyncDatabase() {
  showToast('Connecting to database server... 🔄');
  const ok = await fetchDataFromDatabase(false);
  if (!ok) {
    saveData(true);
    showToast('Cached locally! Will sync when backend is reached.', 'info');
  }
  openDatabaseVaultModal();
}

function downloadDatabaseBackup() {
  const backup = {
    app: 'MaaSaathi',
    exported_at: new Date().toISOString(),
    user_id: 'user_default',
    version: '1.0.0',
    data: APP
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `MaaSaathi_Patient_Vault_${(APP.profile?.name || 'User').replace(/\s+/g, '_')}_${Date.now()}.json`;
  a.click();
  showToast('Patient database vault exported successfully! 💾', 'success');
}

function restoreDatabaseFromFile(event) {
  const file = event.target?.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const dataToRestore = parsed.data || parsed;
      if (dataToRestore && dataToRestore.profile) {
        APP = { ...getDefaultData(), ...dataToRestore };
        saveData(true);
        closeModal();
        showToast('Database vault restored successfully! ✨', 'success');
        renderCurrentPage();
      } else {
        showToast('Invalid backup file structure.', 'error');
      }
    } catch (err) {
      showToast('Failed to parse backup JSON file.', 'error');
    }
  };
  reader.readAsText(file);
}

  renderCurrentPage();
